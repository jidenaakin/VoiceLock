
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - VoiceLock</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080f1f;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard {
            background: #111c32;
            width: 100%;
            max-width: 650px;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #263653;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            color: #60a5fa;
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .status {
            background: #12352d;
            color: #86efac;
            padding: 15px;
            border-radius: 8px;
            margin: 25px 0;
        }

        .logout {
            display: inline-block;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            padding: 13px 30px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .logout:hover {
            background: #2563eb;
        }

        footer {
            color: #64748b;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="icon">🔐</div>

        <h1>Welcome to VoiceLock</h1>

        <p>Your identity has been successfully verified.</p>

        <div class="status">
            ✓ Voice Authentication Successful
        </div>

        <p>
            Hello, <strong>{{ username }}</strong>!
            You now have access to your secure dashboard.
        </p>

        <a href="/logout" class="logout">Log Out</a>

        <footer>
            VOICELOCK © 2026 | VOICE-BASED SECURITY
        </footer>

    </div>

</body>
</html>
