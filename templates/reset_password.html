
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - VoiceLock</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080f1f;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #111c32;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #263653;
        }

        h1 {
            color: #60a5fa;
            text-align: center;
            margin-bottom: 12px;
        }

        p {
            color: #94a3b8;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #080f1f;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #60a5fa;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .message {
            color: #fca5a5;
            text-align: center;
            margin-bottom: 20px;
        }

        footer {
            color: #64748b;
            text-align: center;
            font-size: 11px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔐 New Password</h1>

    <p>
        Your identity has been verified.
        Create a new password for your VoiceLock account.
    </p>

    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}

    <form method="POST" action="/reset-password">

        <label>New Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter new password"
            minlength="8"
            required
        >

        <label>Confirm New Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <footer>
        VOICELOCK © 2026 | VOICE-BASED SECURITY
    </footer>

</div>

</body>
</html>
