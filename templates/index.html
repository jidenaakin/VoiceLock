
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VoiceLock | Voice Authentication</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #080f1f;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            background: #111c32;
            padding: 55px 30px;
            border: 1px solid #263956;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            font-size: 42px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 38px;
            color: #60a5fa;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #aab8cc;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .voice-icon {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #1d3151;
            border: 2px solid #3b82f6;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            font-size: 45px;
        }

        h2 {
            margin-bottom: 12px;
            font-size: 25px;
        }

        .description {
            color: #aab8cc;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        a {
            text-decoration: none;
        }

        button {
            padding: 14px 35px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register {
            background: #3b82f6;
            color: white;
        }

        .login {
            background: transparent;
            color: #60a5fa;
            border: 1px solid #3b82f6;
        }

        button:hover {
            transform: translateY(-3px);
            opacity: 0.85;
        }

        .footer {
            margin-top: 40px;
            color: #71839e;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 30px;
            }

            .container {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🔐</div>

        <h1>VoiceLock</h1>

        <p class="subtitle">
            Advanced Voice Authentication System
            <br>
            Secure your account using your unique voice.
        </p>

        <div class="voice-icon">
            🎙️
        </div>

        <h2>Welcome!</h2>

        <p class="description">
            Your voice is your identity.
            Choose an option below to continue.
        </p>

        <div class="buttons">

            <a href="/register">
                <button class="register">Create Account</button>
            </a>

            <a href="/login">
                <button class="login">Login</button>
            </a>

        </div>

        <div class="footer">
            VOICELOCK © 2026 | VOICE-BASED SECURITY
        </div>

    </div>

</body>
</html>
